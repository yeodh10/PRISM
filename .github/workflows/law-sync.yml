name: Law currency check

# 법령 개정 감지 — law.go.kr 현행 원문과 data/*.json을 조문 단위로 대조한다.
# 차이(개정·새 시행본)가 있으면 실패로 알린다. 반영: python -m scripts.sync_laws --write
on:
  schedule:
    - cron: "17 21 * * 0" # 매주 월요일 06:17 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: law.go.kr 현행본과 대조 (표준 라이브러리만 — 의존성 설치 없음)
        run: python -m scripts.sync_laws -v
